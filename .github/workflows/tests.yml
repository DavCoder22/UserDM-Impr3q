name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.2
        bundler-cache: true
    
    - name: Set up test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db_test
        RAILS_ENV: test
        RACK_ENV: test
      run: |
        bundle exec rake db:create
        bundle exec rake db:migrate
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db_test
        RAILS_ENV: test
        RACK_ENV: test
        JWT_SECRET: test-secret-key-1234567890
        REDIS_URL: redis://localhost:6379/0
      run: |
        mkdir -p test-results
        bundle exec rspec --format progress --format RspecJunitFormatter --out test-results/rspec.xml
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: test-results/
        retention-days: 5
    
    - name: Upload coverage
      if: success() || failure()
      uses: actions/upload-artifact@v3
      with:
        name: coverage
        path: coverage/
        retention-days: 5
