# Define networks for better isolation
networks:
  app_network:
    driver: bridge

services:
  # Nginx as Load Balancer
  nginx_alb:
    image: nginx:alpine
    container_name: nginx_alb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-register-service
      - auth-login-service
      - auth-profile-service
      - auth-password-service
      - auth-logout-service
      - auth-history-service
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  db:
    image: postgres:15-alpine
    container_name: auth_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for token blacklist and session management
  redis:
    image: redis:7-alpine
    container_name: auth_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_secure_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Register Service
  auth-register-service:
    build:
      context: .
      dockerfile: auth-register-service/Dockerfile
    container_name: auth_register_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - REDIS_URL=${REDIS_URL:-redis://:your_secure_password@redis:6379/0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Login Service
  auth-login-service:
    build:
      context: .
      dockerfile: auth-login-service/Dockerfile
    container_name: auth_login_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - REDIS_URL=${REDIS_URL:-redis://:your_secure_password@redis:6379/0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Profile Service
  auth-profile-service:
    build:
      context: .
      dockerfile: auth-profile-service/Dockerfile
    container_name: auth_profile_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - REDIS_URL=${REDIS_URL:-redis://:your_secure_password@redis:6379/0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Password Service
  auth-password-service:
    build:
      context: .
      dockerfile: auth-password-service/Dockerfile
    container_name: auth_password_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - REDIS_URL=${REDIS_URL:-redis://:your_secure_password@redis:6379/0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logout Service
  auth-logout-service:
    build:
      context: .
      dockerfile: auth-logout-service/Dockerfile
    container_name: auth_logout_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://:your_secure_password@redis:6379/0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # History Service
  auth-history-service:
    build:
      context: .
      dockerfile: auth-history-service/Dockerfile
    container_name: auth_history_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - REDIS_URL=${REDIS_URL:-redis://:your_secure_password@redis:6379/0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Perfil Service
  perfil-service:
    build:
      context: .
      dockerfile: perfil-service/Dockerfile
    container_name: perfil_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-login-service:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "3007:4567"
    depends_on:
      db:
        condition: service_healthy
      auth-login-service:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4567/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Historial Service
  historial-service:
    build:
      context: .
      dockerfile: historial-service/Dockerfile
    container_name: historial_service
    environment:
      - RACK_ENV=${RACK_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/auth_db}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "3008:4567"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4567/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Health check service
  health-check:
    image: nginx:alpine
    container_name: health_check
    ports:
      - "8080:80"
    volumes:
      - ./health-check:/usr/share/nginx/html
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes for persistent data
volumes:
  postgres_data:
  redis_data:
